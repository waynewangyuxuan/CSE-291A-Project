# Development pilot. Freeze a separate held-out task selection before evaluation.
[experiment]
suite = "banking"
benchmark_version = "v1.2.2"
task_ids = ["user_task_0", "user_task_2", "user_task_4"]
injection_task_ids = ["injection_task_7"]
mode = "paired"
attack = "ignore_previous_append"

[model]
model = "qwen3-8b-q4_k_m"
base_url = "http://127.0.0.1:8080/v1"
api_key_env = "LOCAL_LLM_API_KEY"
temperature = 0.0
max_tokens = 2048
seed = 0
extra_body = { chat_template_kwargs = { enable_thinking = false }, cache_prompt = false }

[runner]
max_tool_steps = 15
request_timeout_seconds = 120
episode_timeout_seconds = 600
output_root = "artifacts/runs"

[context]
policy = "full"
